name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check

  test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SENRITSU_REQUIRE_MPV: "1"
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml and caches builds.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: -D warnings
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv
      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv
      # CI runners have no sound device. The null output still plays in real
      # time, so the gapless and timing tests stay meaningful.
      - name: Point mpv at the null audio output
        run: |
          mkdir -p "$RUNNER_TEMP/mpv"
          echo "ao=null" > "$RUNNER_TEMP/mpv/mpv.conf"
          echo "MPV_HOME=$RUNNER_TEMP/mpv" >> "$GITHUB_ENV"
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml, which pins the newer toolchain.
      RUSTUP_TOOLCHAIN: "1.90"
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  notifier:
    name: macOS notifier
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/install-macos-notifier.sh --build-only
      - run: codesign --verify target/notifier/SenritsuNotifier.app
