[package]
name = "deadwax"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "A terminal music player for Navidrome and other Subsonic servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voidrender/deadwax"
readme = "README.md"
keywords = ["music", "subsonic", "navidrome", "tui", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
discord-rich-presence = "1.1.0"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = "4.2.0"
md-5 = "0.11.0"
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.3"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.19.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Noise for a binary crate: nothing outside this crate calls these functions.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The event loop and input handlers are long by nature.
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
